<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Adjustments Builder</title>
<style>
:root{
  --ink:#1d2430; --muted:#5f6b7a; --faint:#8a95a3;
  --line:#dbe1e8; --line2:#eef1f5; --bg:#f4f6f8; --panel:#fff;
  --accent:#2c6e8f; --accent-dark:#1f5872;
  --accent2:#e8f1f5; --warn:#8a4a1f; --warnbg:#fdf3e8;
  --ok:#2f6b4f; --okbg:#eaf4ee; --danger:#8f3030;
  --r:8px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:15px;line-height:1.5}
a{color:var(--accent)}
h1,h2,h3,h4{margin:0}
button{font:inherit;border-radius:var(--r);border:1px solid var(--accent);background:var(--accent);
  color:#fff;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
button.ghost{background:var(--panel);color:var(--accent)}
button.plain{background:var(--panel);color:var(--ink);border-color:var(--line)}
button.small{padding:4px 9px;font-size:12.5px}
button.danger{background:var(--panel);color:var(--danger);border-color:#e0c4c4}
button.link{background:none;border:none;color:var(--accent);text-decoration:underline;padding:0;font-size:12.5px}
button:disabled{opacity:.45;cursor:not-allowed}
button:hover:not(:disabled){filter:brightness(1.07)}
input[type=text],input[type=date],select,textarea{width:100%;padding:7px 9px;border:1px solid var(--line);
  border-radius:6px;font:inherit;font-size:14px;background:#fff;color:inherit}
textarea{resize:vertical;min-height:56px}
label.f{display:block;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:3px}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:13.5px;margin-bottom:6px}
.chk input{margin-top:3px;flex:none}

/* layout */
.app{display:flex;min-height:100vh;flex-direction:column}
.top{background:var(--panel);border-bottom:1px solid var(--line);padding:10px 18px;
  display:flex;gap:12px;align-items:center;position:sticky;top:0;z-index:20}
.top h1{font-size:16.5px;font-weight:700;letter-spacing:-.01em}
.top .who{font-size:13px;color:var(--muted);margin-left:4px}
.top .spacer{flex:1 1 auto}
.shell{display:flex;flex:1 1 auto;align-items:flex-start}
nav.side{width:216px;flex:none;padding:14px 10px;position:sticky;top:53px;max-height:calc(100vh - 53px);overflow:auto}
nav.side button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--ink);
  padding:8px 10px;border-radius:6px;font-weight:600;font-size:14px;margin-bottom:2px}
nav.side button.on{background:var(--accent2);color:var(--accent)}
nav.side button .n{float:right;color:var(--faint);font-weight:600;font-size:12px}
nav.side .grp{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);
  padding:12px 10px 4px;font-weight:700}
main{flex:1 1 auto;min-width:0;padding:16px 20px 90px;max-width:1120px}
@media(max-width:860px){ nav.side{display:none} main{padding:14px 12px 90px} }
.mobonly{display:none}
@media(max-width:860px){ .mobonly{display:block;max-width:190px} .top h1{font-size:15px} #savedhint{display:none} }

.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:16px}
.panel > h2{font-size:15.5px;margin-bottom:4px}
.panel > .sub{font-size:13px;color:var(--muted);margin:0 0 12px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g4{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.g2,.g3,.g4{grid-template-columns:1fr}}
.note{background:var(--accent2);border-left:3px solid var(--accent);padding:9px 12px;border-radius:0 6px 6px 0;
  font-size:13px;margin:0 0 14px}
.note.warn{background:var(--warnbg);border-color:#c9873f}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;
  background:var(--line2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.t1{background:var(--okbg);color:var(--ok);border-color:#c6ddcf}
.pill.t2{background:var(--warnbg);color:var(--warn);border-color:#e8d3b8}
.pill.t3{background:#fbeeea;color:#8a4030;border-color:#e8cabf}
.pill.flag{background:#fbeeea;color:#8a4030;border-color:#e8cabf}
.muted{color:var(--muted);font-size:13px}
.tiny{font-size:12px;color:var(--faint)}
.hide{display:none!important}
.rowflex{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.rowflex > div{flex:1 1 190px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.tools input[type=text]{max-width:250px}.tools select{max-width:230px}

/* build screen: navigator | options | selected */
.actwrap{display:flex;gap:14px;align-items:flex-start}
.actlist{width:228px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:8px;position:sticky;top:66px;max-height:calc(100vh - 86px);overflow:auto}
.actlist .dom{font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);
  font-weight:700;padding:10px 8px 4px}
.actlist button{display:flex;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:none;
  color:var(--ink);padding:5px 8px;border-radius:6px;font-size:13px;font-weight:500}
.actlist button.on{background:var(--accent2);color:var(--accent);font-weight:700}
.actlist .dot{width:9px;height:9px;border-radius:50%;background:var(--line);flex:none}
.actlist .dot.done{background:var(--ok)}
.actlist .dot.skip{background:var(--faint)}
.actlist .dot.part{background:#d59b3c}
.actlist .cnt{margin-left:auto;font-size:11.5px;color:var(--faint)}
.actmain{flex:1 1 auto;min-width:0}
.actside{width:340px;flex:none;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;position:sticky;top:66px;max-height:calc(100vh - 86px);overflow:auto}
.actside .sidehead{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.actside .sidehead h3{font-size:14px}
.actside .closeside{display:none;margin-left:auto}
.actside .sel{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:9px 10px;margin-bottom:9px;background:#fbfdfe}
.actside .wording{font-size:13.5px;margin:5px 0}
.actside .editor{border-top:1px dashed var(--line);margin-top:7px;padding-top:7px}
.actside .editor label.f{margin-top:7px}
.danger-link{color:var(--danger)!important}
.warnhint{color:var(--danger);font-weight:600}
.drawer-only{display:none}
@media(max-width:1280px){
  .actside{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);max-height:none;border-radius:0;
    z-index:40;transform:translateX(102%);transition:transform .18s ease;box-shadow:-8px 0 24px rgba(0,0,0,.12)}
  .actside.open{transform:none}
  .actside .closeside{display:inline-block}
  .drawer-only{display:inline-block}
}
@media(max-width:980px){ .actwrap{flex-direction:column} .actlist{width:100%;position:static;max-height:230px} }
.opt{display:flex;gap:9px;padding:9px 10px;border:1px solid var(--line2);border-radius:8px;margin-bottom:7px;background:#fdfefe}
.opt.on{border-color:var(--accent);background:#f6fafc}
.opt input[type=checkbox]{margin-top:4px;width:17px;height:17px;flex:none}
.opt .txt{flex:1 1 auto;min-width:0}
.opt .meta{font-size:12px;color:var(--muted);margin-top:4px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.opt .more{font-size:12.5px;color:var(--muted);margin-top:7px;padding-top:7px;border-top:1px dashed var(--line);display:none}
.opt.open .more{display:block}
.opt .more b{color:var(--ink)}
.sel{border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;
  padding:10px 12px;margin-bottom:9px;background:#fbfdfe}
.sel .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.sel .id{font-size:11.5px;color:var(--faint);font-family:ui-monospace,Menlo,monospace}
.prev{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 14px;font-size:14.5px;line-height:1.6}
.prev .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--faint);font-weight:700;margin-bottom:6px}
.prev table{border-collapse:collapse;width:100%;margin-top:8px;font-size:12.5px}
.prev td,.prev th{border:1px solid var(--line);padding:4px 7px;text-align:left;vertical-align:top}
.prev th{background:var(--line2);color:var(--muted);width:34%;font-weight:600}
.bar{position:sticky;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:9px 18px;
  display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:15}
.bar .spacer{flex:1 1 auto}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.steps span{font-size:12px;padding:3px 9px;border-radius:999px;background:var(--line2);color:var(--muted)}
.steps span.on{background:var(--accent);color:#fff;font-weight:600}
.steps span.done{background:var(--okbg);color:var(--ok)}
.progress{height:6px;background:var(--line2);border-radius:999px;overflow:hidden;margin:6px 0 2px}
.progress i{display:block;height:100%;background:var(--accent)}
table.plain{border-collapse:collapse;width:100%;font-size:13.5px}
table.plain td,table.plain th{border-bottom:1px solid var(--line2);padding:6px 8px;text-align:left;vertical-align:top}
table.plain th{color:var(--muted);font-size:12px;font-weight:600}
@media print{ .top,.bar,nav.side,.tools,.noprint{display:none!important} body{background:#fff} }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>Adjustments Builder</h1>
    <span class="who" id="whoami"></span>
    <select class="mobonly" id="mobnav" aria-label="Go to"></select>
    <span class="spacer"></span>
    <span class="tiny" id="savedhint">Saved on this device</span>
    <span class="tiny" id="appversion" title="Build identifier — quote this when reporting a problem">v2026.09.13 (6a16d50) +local changes</span>

  <div class="shell">
    <nav class="side" id="sidenav"></nav>
    <main id="main"></main>
  </div>
  <div class="bar noprint" id="bar"></div>
</div>

","action":"Make meetings work for the family","wording":"The {role} should arrange {preferredName}'s meetings so the family can take part — timing, location, interpreters, who attends and how the meeting is run — and check with the family afterwards that it worked, so participation is real rather than formal.","frequency":"before and after each meeting","intensity":"Arrangements agreed with the family in advance and checked afterwards","evidence":["family attendance and participation","what the family asks to change"],"flags":{},"activities":[24],"actLabels":["Forming Relationships"]},{"id":"R-CUL-03","role":"cultural_lead","tier":2,"category":"Staff capability and briefing","action":"Brief staff on culturally responsive practice","wording":"The {role} should brief the staff working with {preferredName} on the culturally responsive practice agreed with the family, including what to avoid, before those staff first work with {preferredName}, so cultural safety does not depend on individual awareness.","frequency":"before first contact and at the start of each year","intensity":"Briefing with the agreed practice written down","evidence":["staff practice reported by the student and family"],"flags":{},"activities":[26,13],"actLabels":["Interacting According to Social Rules","Interpreting Non-Verbal Messages"]},{"id":"R-CUL-04","role":"cultural_lead","tier":2,"category":"Cultural safety and community","action":"Connect the student with community and mentoring","wording":"The {role} should connect {preferredName} with cultural mentoring or community programmes the family agrees to, and follow up that the connection was made, so the school is not the only source of support.","frequency":"at least once a semester, with follow-up within a month","intensity":"Referral plus follow-up confirming contact","evidence":["connections made and sustained","student's engagement with them"],"flags":{},"activities":[24],"actLabels":["Forming Relationships"]},{"id":"R-DO-01","role":"daily_organiser","tier":1,"category":"Staffing and cover","action":"Keep cover consistent for this student","wording":"The {role} should keep cover for {preferredName}'s classes as consistent as possible, using the same relief teachers where there is a choice, so an absent teacher does not also mean an unfamiliar adult every time.","frequency":"each time a class is covered","intensity":"Same relief staff used where a choice exists","evidence":["how often a familiar adult covered the class"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-DO-02","role":"daily_organiser","tier":1,"category":"Staffing and cover","action":"Get the summary to the relief teacher","wording":"The {role} should make sure the relief teacher receives {preferredName}'s one-page summary of adjustments before the lesson starts, so a covered lesson is not a lesson without adjustments.","frequency":"before every covered lesson","intensity":"Summary supplied with the cover notes as a matter of routine","evidence":["covered lessons where the summary was supplied","how those lessons went"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-DO-03","role":"daily_organiser","tier":2,"category":"Staffing and cover","action":"Protect timetabled support staffing","wording":"The {role} should keep {preferredName}'s timetabled support staffing in place rather than redeploying it to cover elsewhere, and tell the plan owner the same day when it genuinely cannot be held, so the loss is visible rather than silent.","frequency":"each day support is timetabled","intensity":"Allocation protected, with same-day notification when it cannot be","evidence":["days the agreed support was not available and why"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-DIL-01","role":"di_lead","tier":2,"category":"Coordination and planning","action":"Convene and document the student support group","wording":"The {role} should convene and document a student support group meeting for {preferredName} each term, recording the agreed adjustments, who is responsible for each one and the review date, and sharing that record with every teacher who teaches {preferredName}, so the same adjustments are implemented across every class rather than in some of them.","frequency":"once each term, and after any significant change","intensity":"Planned meeting with documented actions and named owners","evidence":["adjustments agreed and who owns each one","actions completed between meetings","what teachers report is working"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-DIL-02","role":"di_lead","tier":2,"category":"Documentation and evidence","action":"Keep the record of adjustments current","wording":"The {role} should keep {preferredName}'s record of adjustments current, updating it whenever an adjustment is added, changed or faded, and checking the written record against what is actually happening in classes at least once a term, so the documented plan and {preferredName}'s daily experience describe the same thing.","frequency":"updated as changes occur, checked against practice each term","intensity":"Record maintained by one named person, cross-checked with teachers","evidence":["date and reason for each change","gaps found between the record and practice"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-DIL-03","role":"di_lead","tier":2,"category":"Staff capability and briefing","action":"Brief new and relieving staff before they teach the student","wording":"The {role} should brief every new teacher, casual relief teacher and support staff member before they work with {preferredName}, using a one-page summary of the agreed adjustments and what to do if things go wrong, so support does not drop away when staffing changes.","frequency":"before the first lesson with any new or relieving staff member","intensity":"Short verbal briefing plus a written one-page summary","evidence":["who was briefed and when","whether adjustments continued during the staffing change"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-DIL-04","role":"di_lead","tier":2,"category":"Documentation and evidence","action":"Gather evidence across the year, not the week before","wording":"The {role} should collect evidence for {preferredName}'s plan and any funding or profile process across the whole year — teacher observations, work samples, specialist reports, student voice and family voice — rather than in the fortnight beforehand, so the picture presented is an accurate description of a normal school week.","frequency":"ongoing, with a collection point each term","intensity":"Structured collection against each functional area, held in one place","evidence":["range and dates of evidence held","functional areas with thin evidence"],"flags":{},"activities":[6],"actLabels":["Solving Problems"]},{"id":"R-DIL-05","role":"di_lead","tier":2,"category":"Coordination and planning","action":"Review each term what can be faded","wording":"The {role} should review with {preferredName}'s teachers each term which adjustments are still needed, which should increase and which can be faded, so the level of adult support matches current evidence rather than what was agreed a year ago.","frequency":"once each term","intensity":"Structured review of each adjustment against recent evidence","evidence":["adjustments faded and what happened next","adjustments increased and why"],"flags":{},"activities":[8],"actLabels":["Undertaking Tasks Independently"]},{"id":"R-DIL-06","role":"di_lead","tier":3,"category":"Resourcing and leadership","action":"Timetable the agreed support before the term starts","wording":"The {role} should arrange and timetable the agreed additional support for {preferredName} — staffing, spaces and equipment — before the term begins and confirm it with each teacher, so the adjustment is available from the first lesson instead of being negotiated week by week.","frequency":"before the start of each term and after any timetable change","intensity":"Confirmed allocation in writing before the term starts","evidence":["lessons where the agreed support was not available and why"],"flags":{"plan":1},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-DIL-07","role":"di_lead","tier":2,"category":"Coordination and planning","action":"Escalate unresolved implementation barriers","wording":"The {role} should escalate to the principal class any barrier that stops an agreed adjustment being implemented for {preferredName} and that has not been resolved within a fortnight of being raised, so problems are dealt with at the level that can actually fix them.","frequency":"whenever a barrier remains unresolved after a fortnight","intensity":"Written escalation naming the barrier and what is needed","evidence":["barriers raised, resolved and outstanding"],"flags":{},"activities":[6],"actLabels":["Solving Problems"]},{"id":"R-DIL-08","role":"di_lead","tier":3,"category":"Coordination and planning","action":"Translate specialist advice into school actions","wording":"The {role} should meet with the specialists involved with {preferredName}, with family consent, and translate their recommendations into specific school actions with a named owner and a start date, so advice becomes practice rather than a report in a file.","frequency":"after each new report and at least once a year","intensity":"Documented conversion of each recommendation into an owned action","evidence":["recommendations received and the action taken for each"],"flags":{"plan":1},"activities":[6],"actLabels":["Solving Problems"]},{"id":"R-FA-01","role":"first_aid","tier":2,"category":"Health, care and safety","action":"Keep the agreed response available","wording":"The {role} should make sure {preferredName}'s agreed first aid response, medication and equipment are available and in date at all times the school operates, including sport and offsite activities, so the response does not depend on where {preferredName} is that day.","frequency":"checked at the start of each term and before each offsite activity","intensity":"Stock, currency and location checked against the plan","evidence":["checks completed","occasions the response was needed and what was available"],"flags":{"safety":true,"plan":1},"activities":[21],"actLabels":["Looking After One’s Health"]},{"id":"R-FA-02","role":"first_aid","tier":2,"category":"Documentation and evidence","action":"Record and pass on every event","wording":"The {role} should record every first aid event involving {preferredName} and pass it to the health plan owner and the family the same day, so a pattern is noticed early rather than at the end of term.","frequency":"same day, every time","intensity":"Written record shared with the plan owner and family","evidence":["events recorded","patterns identified"],"flags":{"safety":true},"activities":[21],"actLabels":["Looking After One’s Health"]},{"id":"R-FA-03","role":"first_aid","tier":2,"category":"Staff capability and briefing","action":"Brief the staff on duty","wording":"The {role} should brief the staff on yard and sport duty on {preferredName}'s signs and the required response, at the start of each term and whenever the duty roster changes, so the right response is available wherever {preferredName} is.","frequency":"at the start of each term and on roster changes","intensity":"Briefing plus a response card carried by duty staff","evidence":["staff briefed","accuracy of the response given"],"flags":{"safety":true,"training":1},"activities":[22],"actLabels":["Looking After One’s Safety"]},{"id":"R-IL-01","role":"inclusion_leader","tier":1,"category":"Whole-school practice","action":"Put the universal practices in place first","wording":"The {role} should make sure the practices that reduce the need for individual adjustment — predictable routines, accessible materials, clear eachers at the start of each unit to build the agreed literacy adjustment into the unit's texts, tasks and assessments, so the adjustment is part of the planned work rather than something added when {preferredName} struggles.","frequency":"at the start of each unit","intensity":"Planning conversation per unit with the adjustment written into the plan","evidence":["adjustment named in unit planning","student access to the unit's texts"],"flags":{},"activities":[2],"actLabels":["Reading"]},{"id":"R-LIT-02","role":"literacy_lead","tier":2,"category":"Literacy and numeracy","action":"Set the reading demand of materials","wording":"The {role} should check the reading demand of the materials {preferredName} is given and supply an accessible version at the agreed reading level, keeping the same learning goal, so reading load is not the reason {preferredName} cannot show what they know.","frequency":"for each unit and before each assessment","intensity":"Materials checked and adapted in advance, learning goal unchanged","evidence":["reading level of materials provided","tasks completed independently"],"flags":{"curriculum":1},"activities":[2],"actLabels":["Reading"]},{"id":"R-LIT-03","role":"literacy_lead","tier":2,"category":"Staff capability and briefing","action":"Model the literacy strategy in class","wording":"The {role} should model the agreed explicit literacy strategy in {preferredName}'s classes and coach the teacher to continue it, so the strategy is used consistently rather than only when a specialist is present.","frequency":"at least once per teacher, then follow-up coaching each term","intensity":"In-class modelling followed by teacher-led practice and feedback","evidence":["strategy in use across classes","student response to the strategy"],"flags":{},"activities":[2],"actLabels":["Reading"]},{"id":"R-LIT-04","role":"literacy_lead","tier":3,"category":"Literacy and numeracy","action":"Coordinate targeted literacy intervention","wording":"The {role} should coo chological Demands"]},{"id":"R-MHP-03","role":"mh_practitioner","tier":3,"category":"Health, care and safety","action":"Contribute to the safety or support plan","wording":"The {role} should contribute to {preferredName}'s safety or support plan where a risk has been identified, setting out the warning signs, the agreed response and who does what, and review it after any incident, so staff respond consistently rather than improvising.","frequency":"at plan development, then reviewed each term and after any incident","intensity":"Documented plan with named responders and review points","evidence":["warning signs observed","how closely the agreed response was followed"],"flags":{"safety":true,"plan":2},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-MHP-04","role":"mh_practitioner","tier":3,"category":"Family partnership","action":"Warm handover to an external service","wording":"The {role} should make a warm handover to any external service {preferredName} is referred to, with family consent, and follow up within a fortnight to confirm contact was made, so a referral does not end at the point of paperwork.","frequency":"at referral, with follow-up within a fortnight","intensity":"Direct contact between practitioners plus follow-up confirmation","evidence":["referrals made and whether contact was established"],"flags":{"plan":1},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-MHP-05","role":"mh_practitioner","tier":2,"category":"Staff capability and briefing","action":"Coach staff in the agreed regulation approach","wording":"The {role} should coach the staff who work with {preferredName} in the agreed co-regulation and de-escalation approach, modelling it and observing it in practice, so the approach is used the same way by everyone rather than differently in each class.","frequency":"initial coaching, then observation and feedback once a term","intensity":"Modelling, observation and feedback with the staff involved","evidence":["consistency of the response across staff","escalation frequency"],"flags":{},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-NUM-01","role":"numeracy_lead","tier":2,"category":"Literacy and numeracy","action":"Build the numeracy adjustment into unit planning","wording":"The {role} should work with {preferredName}'s mathematics teachers at the start of each unit to build the agreed numeracy adjustment into the tasks and assessments, so access is planned rather than improvised in the lesson.","frequency":"at the start of each unit","intensity":"Planning conversation per unit with the adjustment written into the plan","evidence":["adjustment named in unit planning","access to the unit's tasks"],"flags":{},"activities":[4],"actLabels":["Mathematics: Calculating"]},{"id":"R-NUM-02","role":"numeracy_lead","tier":2,"category":"Literacy and numeracy","action":"Provide the agreed tools and scaffolds","wording":"The {role} should make sure {preferredName} has the agreed numeracy tools and scaffolds — concrete materials, a calculator, formula or steps reference — available in every relevant lesson, so working memory and recall are not what limits the mathematics {preferredName} can do.","frequency":"in every relevant lesson","intensity":"Tools available by default, without the student having to ask","evidence":["tools used and by whose prompt","tasks attempted and completed"],"flags":{"curriculum":1},"activities":[4],"actLabels":["Mathematics: Calculating"]},{"id":"R-NUM-03","role":"numeracy_lead","tier":2,"category":"Literacy and numeracy","action":"Set the entry point from data","wording":"The {role} should use {preferredName}'s numeracy assessment data to set the point the teaching starts from, and share that with the teachers, so tasks sit where {preferredName} can actually work rather than at the year level by default.","frequency":"at the start of each year and after each assessment cycle","intensity":"Data analysis translated into a stated entry point per teacher","evidence":["growth from the entry point","match between tasks set and the entry point"],"flags":{},"activities":[4],"actLabels":["Mathematics: Calculating"]},{"id":"R-NUM-04","role":"numeracy_lead","tier":3,"category":"Literacy and numeracy","action":"Coordinate targeted numeracy intervention","wording":"The {role} should coordinate a targeted numeracy intervention for {preferredName} at an agreed frequency, checking progress at a set interval and stopping or changing it if the evidence does not show growth, so time out of class is justified by what it produces.","frequency":"sessions at the agreed frequency, progress checked every five weeks","intensity":"Small-group or individual instruction with documented progress checks","evidence":["progress against the entry point","transfer into class work"],"flags":{"plan":1},"activities":[4],"actLabels":["Mathematics: Calculating"]},{"id":"R-NUR-01","role":"nurse","tier":3,"category":"Health, care and safety","action":"Maintain and review the health support plan","wording":"The {role} should maintain {preferredName}'s health support plan with the family and the treating practitioner, train the staff named in it, and review it at least annually and after any health event, so the school response is current and delivered by trained people.","frequency":"reviewed annually and after any health event","intensity":"Written plan, named trained staff, training currency tracked","evidence":["training currency","health events and the response given"],"flags":{"safety":true,"plan":2,"training":1},"activities":[21],"actLabels":["Looking After One’s Health"]},{"id":"R-NUR-02","role":"nurse","tier":3,"category":"Health, care and safety","action":"Make sure the health procedure travels with the student","wording":"The {role} should make sure {preferredName}'s medication, equipment and health procedure are available wherever the school programme takes place, including excursions, camps and sport, so participation is never limited by where the equipment is kept.","frequency":"before every offsite activity and daily on site","intensity":"Checked against the plan before each activity","evidence":["activities attended","occasions the procedure was needed offsite"],"flags":{"safety":true,"plan":2},"activities":[21],"actLabels":["Looking After One’s Health"]},{"id":"R-NUR-03","role":"nurse","tier":2,"category":"Staff capability and briefing","action":"Brief staff on signs and the required response","wording":"The {role} should brief the staff who teach or supervise {preferredName} on the signs to watch for and the exact response required, before those staff first work with {preferredName} and again each year, so the response does not depend on who happens to be there.","frequency":"before first contact and annually","intensity":"Briefing plus a written response card held where staff can reach it","evidence":["staff briefed and when","accuracy of the response given"],"flags":{"safety":true,"training":1},"activities":[21],"actLabels":["Looking After One’s Health"]},{"id":"R-NUR-04","role":"nurse","tier":3,"category":"Health, care and safety","action":"Review after any health incident","wording":"The {role} should review the plan with the family after any health incident involving {preferredName}, within a week, and change the plan where the incident showed it was needed, so the plan improves each time it is tested.","frequency":"within a week of any health incident","intensity":"Documented review with the family and changes made to the plan","evidence":["incidents and the plan changes that followed"],"flags":{"safety":true,"plan":2},"activities":[21],"actLabels":["Looking After One’s Health"]},{"id":"R-PRIN-01","role":"principal_class","tier":3,"category":"Resourcing and leadership","action":"Resource the agreed adjustments","wording":"The {role} should make sure the adjustments agreed for {preferredName} are resourced —  arrangements","wording":"The {role} should approve the risk assessment and duty-of-care arrangements for any safety-critical adjustment for {preferredName}, confirm the staff involved are trained, and review the arrangement after any incident, so safety does not depend on informal practice.","frequency":"before the arrangement starts, then reviewed each term and after any incident","intensity":"Documented approval, named trained staff, incident review","evidence":["training currency","incidents and the review outcome"],"flags":{"safety":true,"plan":2,"training":1},"activities":[22],"actLabels":["Looking After One’s Safety"]},{"id":"R-PRIN-05","role":"principal_class","tier":2,"category":"Whole-school practice","action":"Build the adjustments into staff professional learning","wording":"The {role} should include the practices {preferredName} depends on in whole-staff professional learning and planning, so the adjustment is part of how the school teaches rather than an exception a few staff know about.","frequency":"at least once a year in the professional learning schedule","intensity":"Scheduled whole-staff learning with follow-up in teams","evidence":["staff confidence and consistency reported by teachers"],"flags":{},"activities":[5],"actLabels":["Focusing and Directing Attention"]},{"id":"R-PRIN-06","role":"principal_class","tier":2,"category":"Coordination and planning","action":"Protect the plan through staffing and year-level changes","wording":"The {role} should make sure {preferredName}'s plan and adjustments are handed over whenever the teaching team, year level or leadership changes, with the handover completed before the change takes effect, so nothing has to be rebuilt from scratch.","frequency":"before every staffing, year level or leadership change","intensity":"Documented handover with the receiving staff named","evidence":["handovers completed on time","adjustments lost after a change"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-PSC-01","role":"psc_lead","tier":2,"category":"Behaviour and engagement","action":"Teach the specific skill explicitly","wording":"The {role} should teach {preferredName} the specific self-management or social skill named in the plan explicitly, at an agreed time each week, and tell the teachers which skill to reinforce that fortnight, so the skill is taught rather than expected.","frequency":"one session a week, with the reinforcement focus shared each fortnight","intensity":"Explicit teaching with a named focus reinforced in class","evidence":["the skill in use outside the session","student's own account of what is getting easier"],"flags":{},"activities":[10],"actLabels":["Managing One’s Own Behaviour"]},{"id":"R-PSC-02","role":"psc_lead","tier":1,"category":"Whole-school practice","action":"Put the capability goal in the curriculum plan","wording":"The {role} should make sure {preferredName}'s personal and social capability goal appears in the curriculum plan and in reporting alongside academic goals, so growth in these areas is recognised as learning rather than as behaviour.","frequency":"at each planning and reporting cycle","intensity":"Goal written into planning and reported on","evidence":["progress reported against the capability goal"],"flags":{},"activities":[25],"actLabels":["Regulating Behaviours Within Interactions"]},{"id":"R-PSC-03","role":"psc_lead","tier":2,"category":"Behaviour and engagement","action":"Set up a structured social opportunity","wording":"The {role} should set up a structured activity at break times that {preferredName} can join with a known adult nearby, and step that adult back as {preferredName} settles, so social contact is available without depending on an adult being present.","frequency":"at the agreed break times each week","intensity":"Structured activity with adult support that reduces over time","evidence":["participation","time spent without adult support"],"flags":{},"activities":[24,15],"actLabels":["Forming Relationships","Conversation"]},{"id":"R-PSC-04","role":"psc_lead","tier":2,"category":"Relationship and daily contact","action":"Co-design the regulation strategies with the student","wording":"The {role} should design {preferredName}'s self-regulation strategies with {preferredName} rather than for them, write them in {preferredName}'s words and share them with staff with consent, so the strategies are ones {preferredName} will actually use.","frequency":"designed once and reviewed each term with the student","intensity":"Student-led design with adult scribing, shared with consent","evidence":["strategies the student chooses to use","what the student asks to change"],"flags":{},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-ES-01","role":"support_staff","tier":2,"category":"In-class assistance","action":"Provide the agreed assistance, prompting before helping","wording":"The {role} should provide the agreed in-class assistance to {preferredName} under teacher and plan direction, prompting the agreed strategy before giving direct help, and recording how much prompting was needed, so support can be faded on evidence rather than habit.","frequency":"in each lesson where the agreed adjustment applies","intensity":"Prompt first, direct assistance only where the prompt is not enough","evidence":["level of prompting required","tasks completed with less help than last time"],"flags":{},"activities":[8,1,12,14,3],"actLabels":["Undertaking Tasks Independently","Listening","Interpreting Spoken Messages","Using Expressive Language: Speaking","Writing"]},{"id":"R-ES-02","role":"support_staff","tier":2,"category":"In-class assistance","action":"Prepare adapted materials before the lesson","wording":"The {role} should prepare or adapt {preferredName}'s materials in the agreed format before the lesson begins, under teacher direction, so {preferredName} starts the task at the same time as everyone else.","frequency":"before each lesson where adapted materials are needed","intensity":"Materials ready in advance to the agreed specification","evidence":["lessons started on time with the right materials"],"flags":{},"activities":[5,3,28,11],"actLabels":["Focusing and Directing Attention","Writing","Fine Motor Skills","Producing Non-Verbal Messages"]},{"id":"R-ES-03","role":"support_staff","tier":2,"category":"In-class assistance","action":"Support unstructured times","wording":"The {role} should be available to {preferredName} at the agreed unstructured times — recess, lunch or transitions — supporting entry into an activity or group rather than supervising from beside them, so the time is used well without creating dependence on an adult.","frequency":"at the agreed break or transition times each day","intensity":"Available nearby, actively supporting entry to an activity, stepping back once settled","evidence":["activities and groups joined","time spent without adult support"],"flags":{},"activities":[24],"actLabels":["Forming Relationships"]},{"id":"R-ES-04","role":"support_staff","tier":2,"category":"Documentation and evidence","action":"Record observations against the plan","wording":"The {role} should record short, specific observations of {preferredName} against the goals in the plan each week and give them to the teacher and the plan coordinator, so decisions are made on what is actually happening in lessons.","frequency":"weekly","intensity":"Brief written observations tied to the plan goals","evidence":["observations recorded","changes made because of them"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-ES-05","role":"support_staff","tier":3,"category":"Health, care and safety","action":"Support the personal care or health routine","wording":"The {role}, where trained and named in the plan, should support {preferredName}'s agreed personal care or health routine at the times set out in the plan, in a private space and in a way that maintains dignity and builds whatever independence is possible, so the routine is met safely without drawing attention.","frequency":"at the times set out in the plan","intensity":"Trained staff only, following the documented procedure, privacy maintained","evidence":["routine completed as planned","steps the student now manages independently"],"flags":{"safety":true,"plan":2,"training":1},"activities":[21,16,17,18,19,20],"actLabels":["Looking After One’s Health","Drinking","Eating","Dressing","Toileting","Washing Oneself"]},{"id":"R-ES-06","role":"support_staff","tier":2,"category":"Health, care and safety","action":"Support excursions, camps and offsite activities","wording":"The {role} should support {preferredName} on excursions, camps and offsite activities according to the risk assessment completed before the activity, so {preferredName} takes part in the same programme as everyone else.","frequency":"for each offsite activity","intensity":"Support level set by the risk assessment for that activity","evidence":["offsite activities attended","supports that were needed on the day"],"flags":{"plan":2},"activities":[29,27],"actLabels":["Moving From Place to Place","Lifting and Carrying Objects"]},{"id":"R-IO-01","role":"support_staff","tier":2,"category":"Assessment and curriculum access","action":"Translate the plan into subject-level adjustments","wording":"The {role} should work with each subject teacher at the start of every unit to turn {preferredName}'s plan into the specific adjustments that unit needs, so the plan is applied to the actual work rather than sitting above it.","frequency":"at the start of each unit in each subject","intensity":"Short planning conversation per subject with agreed unit-level adjustments","evidence":["adjustments named in unit planning","student access to the unit's tasks"],"flags":{},"activities":[6],"actLabels":["Solving Problems"]},{"id":"R-IO-02","role":"support_staff","tier":2,"category":"Staff capability and briefing","action":"Model the adjustment in the classroom","wording":"The {role} should model or co-teach the agreed adjustment in {preferredName}'s classes at least once per teacher, then hand it back to the teacher, so staff see how it works rather than only reading about it.","frequency":"at least once per teacher, and after any new adjustment is agreed","intensity":"In-class modelling followed by teacher-led practice","evidence":["teacher confidence and use after modelling"],"flags":{},"activities":[5],"actLabels":["Focusing and Directing Attention"]},{"id":"R-IO-03","role":"support_staff","tier":2,"category":"Documentation and evidence","action":"Check adjustments are visible in practice","wording":"The {role} should check each term whether {preferredName}'s agreed adjustments are visible in classroom practice, and feed what is found back to the teacher and the plan coordinator without blame, so gaps are found by the school rather than by the family.","frequency":"once a term across a sample of classes","intensity":"Short classroom visits against a specific list of agreed adjustments","evidence":["adjustments seen in practice","gaps and what was done about them"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-IO-04","role":"support_staff","tier":2,"category":"Assessment and curriculum access","action":"Arrange assessment adjustments in advance","wording":"The {role} should arrange {preferredName}'s agreed assessment adjustments — such as extra time, an alternative format, a separate space or a reader or scribe — before each formal assessment, checking each one against what the task is meant to assess, so access is provided without changing what is being measured.","frequency":"before each formal assessment","intensity":"Arranged in advance and confirmed with the student and the teacher","evidence":["adjustments provided and used","student report of the assessment conditions"],"flags":{"curriculum":1},"activities":[6,3],"actLabels":["Solving Problems","Writing"]},{"id":"R-LM-01","role":"support_staff","tier":2,"category":"Relationship and daily contact","action":"Preview the week with the student","wording":"The {role} should meet {preferredName} at the start of each week to preview what is coming — assessments, changes to routine, unfamiliar activities — and note anything that needs preparing, so the week holds fewer surprises.","frequency":"once at the start of each week","intensity":"Short individual meeting with a written or visual summary of the week","evidence":["what the student flagged as difficult","preparation that reduced the difficulty"],"flags":{},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-LM-02","role":"support_staff","tier":2,"category":"Relationship and daily contact","action":"Start and end of day check-in","wording":"The {role} should check in with {preferredName} at the start and end of each day to set up equipment, materials and the day's plan and to close the day off, so the day starts organised and does not end on an unresolved problem.","frequency":"twice a day, every day","intensity":"Brief, predictable individual contact at fixed times","evidence":["arrival organisation","issues resolved before the student goes home"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-LM-03","role":"support_staff","tier":2,"category":"Relationship and daily contact","action":"Be present at the identified hard transitions","wording":"The {role} should be present at the transitions {preferredName} finds hardest, prompting the agreed strategy before offering direct help, and stepping back as {preferredName} manages the transition independently, so support fades as skill grows.","frequency":"at the identified transitions each day they occur","intensity":"Present nearby, prompting first, direct help only if the prompt is not enough","evidence":["level of prompting needed","transitions managed independently"],"flags":{},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-LM-04","role":"support_staff","tier":2,"category":"Documentation and evidence","action":"Watch attendance and engagement patterns","wording":"The {role} should track {preferredName}'s attendance and engagement each week, act on a pattern in the week it appears rather than at the end of term, and tell the family what has been noticed, so a drift is interrupted early.","frequency":"reviewed weekly, acted on in the same week","intensity":"Weekly pattern check with a defined follow-up action","evidence":["attendance and lesson engagement patterns","action taken and its effect"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-LM-05","role":"support_staff","tier":2,"category":"Relationship and daily contact","action":"Restorative follow-up after conflict","wording":"The {role} should hold a restorative conversation with {preferredName} after any conflict, once {preferredName} is regulated and before returning to the setting, covering what happened, who was affected and what will be done differently, so the return to class is planned rather than raw.","frequency":"after each incident, before returning to the setting","intensity":"Individual conversation with a plan for the return and any repair","evidence":["repair actions completed","repeat conflicts of the same kind"],"flags":{},"activities":[25],"actLabels":["Regulating Behaviours Within Interactions"]},{"id":"R-LM-06","role":"support_staff","tier":2,"category":"Relationship and daily contact","action":"Be the consistent named adult","wording":"The {role} should be {preferredName}'s consistent named adult across the year, known to {preferredName} and the family, with a named backup for absences, so there is always someone who knows the whole picture.","frequency":"across the whole year, with a named backup","intensity":"One consistent relationship, handed over only with a full briefing","evidence":["who the student goes to when something is wrong"],"flags":{},"activities":[24],"actLabels":["Forming Relationships"]},{"id":"R-TR-01","role":"transition_lead","tier":2,"category":"Transition and pathways","action":"Plan the transition in","wording":"The {role} should plan {preferredName}'s transition into the school or the next year level with orientation visits at quiet times, photos of the key places and adults, and a first-day plan, so the first day is familiar rather than new.","frequency":"across the term before the transition","intensity":"Several planned visits plus written and visual information for the student and family","evidence":["visits completed","student and family report of the first weeks"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-TR-02","role":"transition_lead","tier":2,"category":"Transition and pathways","action":"Hand the plan to the receiving staff before day one","wording":"The {role} should pass {preferredName}'s plan and current adjustments to the receiving teachers or school, with consent, before the first day rather than after it, and confirm they have been read, so support starts on day one.","frequency":"before the first day of the new setting or year","intensity":"Documented handover with confirmation of receipt","evidence":["handover date","adjustments in place in the first week"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-TR-03","role":"transition_lead","tier":2,"category":"Transition and pathways","action":"Plan the post-school pathway with the student","wording":"The {role} should plan {preferredName}'s post-school pathway with {preferredName} and the family from the senior years onward, including the adjustments needed for work experience, further study or employment, so the pathway is built early and led by the student.","frequency":"at least twice a year through the senior years","intensity":"Student-led planning meetings with documented actions","evidence":["pathway actions completed","student's stated goals and how they change"],"flags":{},"activities":[6],"actLabels":["Solving Problems"]},{"id":"R-TR-04","role":"transition_lead","tier":2,"category":"Transition and pathways","action":"Manage mid-year changes of class or subject","wording":"The {role} should manage any mid-year change of class, subject or teacher for {preferredName} as a planned transition, briefing the new staff and preparing {preferredName} beforehand, so a change of timetable does not undo settled routines.","frequency":"before each mid-year change","intensity":"Advance briefing of staff plus preparation with the student","evidence":["settling after the change","supports carried across"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-WB-01","role":"wellbeing","tier":2,"category":"Wellbeing and mental health","action":"Planned weekly check-in","wording":"The {role} should hold a planned check-in with {preferredName} at an agreed time each week, in a consistent place with the same adult, so early signs of distress are noticed and acted on before they escalate.","frequency":"once a week at an agreed time","intensity":"Short individual conversation with the same adult each time","evidence":["patterns raised by the student","early signs noticed and what was done"],"flags":{},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-WB-02","role":"wellbeing","tier":3,"category":"Wellbeing and mental health","action":"Coordinate a graduated return after absence","wording":"The {role} should coordinate a written return-to-school plan for {preferredName} after any extended absence, setting out which classes are returned to first, who meets them at the gate and how the plan builds back to a full timetable, so returning is a supported process rather than a single hard day.","frequency":"after any absence beyond the agreed threshold, reviewed weekly","intensity":"Written plan, named adult on arrival, weekly review of the build-back","evidence":["days and classes attended","student and family report of the return"],"flags":{"plan":2},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-WB-03","role":"wellbeing","tier":2,"category":"Wellbeing and mental health","action":"Agree and teach a safe place and how to get there","wording":"The {role} should agree a specific safe place with {preferredName}, document how it is accessed and who is notified, teach {preferredName} how to use it and brief the teaching team, so leaving a situation safely does not depend on negotiating it in the moment.","frequency":"set up once, taught before it is needed, reviewed each term","intensity":"Documented process, taught to the student, known by all their teachers","evidence":["how often it is used and what triggered it","whether the student initiated it independently"],"flags":{"plan":1},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-WB-04","role":"wellbeing","tier":2,"category":"Wellbeing and mental health","action":"Co-design a 'what helps me' summary with the student","wording":"The {role} should work with {preferredName} to write a short 'what helps me' summary in {preferredName}'s own words and, with their consent, share it with their teachers, so staff act on what the student says helps rather than on assumption.","frequency":"written once and reviewed each semester with the student","intensity":"Student-led drafting with adult scribing support, shared with consent","evidence":["what the student names as helpful","changes at review"],"flags":{},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-WB-05","role":"wellbeing","tier":3,"category":"Family partnership","action":"Hold the link with family and outside services","wording":"The {role} should be the school's named contact with {preferredName}'s family and any outside service, with consent, passing on relevant information in both directions within an agreed timeframe, so the family tells the story once and school and service advice do not contradict each other.","frequency":"contact at least fortnightly while support is active","intensity":"Named single point of contact with documented information sharing","evidence":["information shared and consent recorded","alignment between school and service advice"],"flags":{"plan":1},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-WB-06","role":"wellbeing","tier":2,"category":"Staff capability and briefing","action":"Debrief staff after a significant incident","wording":"The {role} should debrief the staff involved after any significant incident involving {preferredName}, within the same week, covering what happened, what worked and what will change, so the response improves and staff are supported.","frequency":"within a week of any significant incident","intensity":"Structured debrief with agreed changes recorded","evidence":["changes agreed after each debrief","repeat incidents of the same type"],"flags":{},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-YLL-01","role":"year_level_leader","tier":2,"category":"Coordination and planning","action":"Use the plan when setting classes and timetables","wording":"The {role} should take {preferredName}'s plan into account when class lists, groupings and timetables are set, before the lists are finalised, so predictable difficulties are designed out rather than managed all year.","frequency":"at each timetable or class list cycle","intensity":"Plan consulted before decisions are locked in","evidence":["placement decisions and how they worked out"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-YLL-02","role":"year_level_leader","tier":2,"category":"Staff capability and briefing","action":"Brief the year level team each term","wording":"The {role} should brief the year level team on {preferredName}'s current adjustments at the start of each term, including what to do when things are not going well, so every teacher in the team is working from the same information.","frequency":"at the start of each term","intensity":"Team briefing with the written summary distributed","evidence":["consistency of response reported across the team"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-YLL-03","role":"year_level_leader","tier":2,"category":"Coordination and planning","action":"Keep behaviour responses consistent with the plan","wording":"The {role} should make sure responses to {preferredName}'s behaviour follow the agreed plan rather than the generic consequence, and check any referral against the plan before it proceeds, so the response accounts for the disability-related need.","frequency":"whenever a behaviour response or referral is made","intensity":"Plan checked before a consequence or referral is applied","evidence":["responses consistent with the plan","referrals reviewed and their outcome"],"flags":{"plan":1},"activities":[10],"actLabels":["Managing One’s Own Behaviour"]},{"id":"R-YLL-04","role":"year_level_leader","tier":2,"category":"Assessment and curriculum access","action":"Manage assessment load and clashes","wording":"The {role} should monitor {preferredName}'s assessment load across subjects and adjust due dates where several fall in the same week, in line with the plan, so the workload is manageable without lowering what is expected.","frequency":"at each assessment cycle","intensity":"Cross-subject check with due dates adjusted where they clash","evidence":["assessments submitted","weeks where the load was adjusted"],"flags":{"curriculum":1},"activities":[6],"actLabels":["Solving Problems"]},{"id":"R-SC-01","role":"support_coordinator","tier":2,"category":"Coordination and planning","action":"Coordinate ES staff deployment on the day","wording":"The {role} should coordinate the deployment of ES and support staff for {preferredName} each day, matching staff to classes and activities in the plan, adjusting for absences and keeping a record of what was provided, so support is reliable rather than dependent on who is available.","frequency":"at the start of each day, adjusted as the day unfolds","intensity":"Daily coordination with a written record of deployment","evidence":["planned versus actual deployment","lessons where the agreed support was not available and why"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]},{"id":"R-SC-02","role":"support_coordinator","tier":2,"category":"Coordination and planning","action":"Triage on-the-day DI and student needs","wording":"The {role} should triage on-the-day requests for DI related support for {preferredName} — new concerns, escalations and changes in presentation — deciding what can be handled immediately, what needs the DI leader and what needs the wellbeing or behaviour lead, so urgent needs are addressed quickly and nothing is missed.","frequency":"as needs arise each day, with unresolved matters handed to the DI leader the same day","intensity":"Single point of triage with a clear escalation path","evidence":["requests triaged and outcome","response time for urgent matters"],"flags":{},"activities":[9],"actLabels":["Handling Stress and Other Psychological Demands"]},{"id":"R-SC-03","role":"support_coordinator","tier":2,"category":"Staff capability and briefing","action":"Brief and debrief ES staff around the student","wording":"The {role} should brief ES staff working with {preferredName} at the start of the day on what is planned and debrief them at the end, passing on relevant teacher feedback and student voice, so support stays consistent and improvements are shared rather than isolated.","frequency":"brief daily and debrief daily or at the end of the shift","intensity":"Short structured handover with the plan as the reference","evidence":["handovers completed","adjustments to support after debrief"],"flags":{},"activities":[8],"actLabels":["Undertaking Tasks Independently"]},{"id":"R-SC-04","role":"support_coordinator","tier":2,"category":"Documentation and evidence","action":"Keep DI admin and records current on the day","wording":"The {role} should keep {preferredName}'s DI related admin current on the day — attendance at support, changes to deployment, notes from triage and handover — and pass a summary to the DI leader weekly, so the formal record reflects what actually happened.","frequency":"daily notes, summarised weekly","intensity":"Contemporaneous notes held in one place with a weekly summary","evidence":["records completed on the day","weekly summaries passed to the DI leader"],"flags":{},"activities":[7],"actLabels":["Carrying Out Daily Routines"]}],"items":[{"id":"D1-A01-PE-01","d":0,"a":0,"l":0,"c":0,"rk":["classroom_teacher"],"sk":[],"rq":"","ta":true,"ac":"Maintain ordinary accessible supports and resources in the setting.","at":"Maintain ordinary accessible supports and resources in the setting","ao":"access visual information or demonstrations or images or screen-based content","ctx":"visual information; demonstrations; images; screen-based content","f":"available routinely in the setting","i":"Ordinary supports/resources available in the setting","ev":["access and participation","prompt or assistance level","independent use of the support","task engagement/completion where relevant"],"sv":"Which part of this support helps you most when working with visual information; demonstrations; images; screen-based content? What should we keep, change or fade?","ind":"Teach the student how and when to use the support; prompt use before increasing direct assistance; fade prompts when evidence shows increasing independence.","sc":0,"rp":0,"rt":0,"cm":0,"st":"working_draft"},{"id":"D1-A01-DT-01A","d":0,"a":0,"l":1,"c":0,"rk":["classroom_teacher"],"sk":["support_staff"],"rq":"","ta":true,"ac":"Help the student identify key <script>"use strict";

const DB = JSON.parse(document.getElementById('adj-data').textContent);

const $ = s => document.querySelector(s);

const K_SET = 'adjb.settings.v3';   // school preferences — survive "new student"
const K_STU = 'adjb.student.v3';    // the student being worked on

/* ---------- preference definitions ---------- */
const FIELD_DEFS = [

  ['startdate',  'Start date',                  false],
  ['reviewdate', 'Review date',                 false],
  ['approver',   'Approved by and date',        false],
  ['notes',      'Notes',                       true],
  ['id',         'Record ID',                   false],
  ['vc',         'Curriculum link',             false],
];
/* FIELD_DEFS is plain data, so the school's own word for its curriculum is
   resolved when a label is displayed rather than baked into the table. */
function fieldLabel(key, label) { return key === 'vc' ? W('curriculum') + ' link' : label; }
const STRUCTURES = [
  ['role',     'Who does it, then what, then why',
   'The Classroom Teacher should provide …, most days, so David can …'],
  ['outcome',  'Why first, then who does what',
   'So that David can …, the Classroom Teacher should provide …, most days.'],
  ['setting',  'Where or when first',
   'During reading tasks, the Classroom Teacher should provide …, so David can …'],
  ['labelled', 'Labelled lines',
   'Adjustment: … / Frequency: … / Intensity: … / Who is responsible: …'],
  ['table',    'A table, one row per adjustment',
   'Columns: adjustment, frequency, intensity, who, access outcome'],
  ['source',   'Use the library wording unchanged',
   'The Classroom Teacher should provide …, supporting David to …'],
];
const AUDIENCES = [
  ['staff',   'Staff',

  ['family',  'Family and carers',
   "David's teachers will provide …, so David can …"],
  ['student', 'The student, in their own words',
   'My teachers will provide …, so I can …'],
  ['log',     'A record of what was provided',
   'Adjustment provided for David: … This supported David to …'],
];
const EMPH_PARTS = [
  ['role',      'The role'],
  ['action',    'The action'],
  ['student',   "The student's name"],
  ['frequency', 'The frequency'],
  ['outcome',   'The access outcome'],
  ['setting',   'The setting or trigger'],
];
const EMPH_STYLES = [['none', 'Plain'], ['bold', 'Bold'], ['italic', 'Italic'], ['underline', 'Underlined']];
const COLOURS = [['', 'Same as the text'], ['#1f5872', 'Blue'], ['#8a3030', 'Red'], ['#2f6b4f', 'Green'],
                 ['#5b4a86', 'Purple'], ['#8a5a1f', 'Amber'], ['#5f6b7a', 'Grey']];
const STATUSES = ['Proposed', 'Agreed', 'In place', 'Under trial', 'Being faded', 'Ceased'];

function defaultTiers() {
  return TIERS.map((t, i) => ({ label: t.label, maps: i + 1 }));
}
function defaultSettings() {
  const fields = {}; FIELD_DEFS.forEach(([k, , on]) => fields[k] = on);
  return {
    v: 3,
    onboarded: false,
    roleLabels: {},                 // key -> the school's own label
    rolesOff: [],                   // roles this school does not have

    staff: [],                      // [{name, role}]
    words: { student:'student', adjustment:'adjustment', level:'level of adjustment', plan:'plan', curriculum:'Curriculum' },
    showTiers: true,
    tierList: defaultTiers(),       // the school's own tier names, in their order
    structure: 'role',
    modal: 'should',
    includeSetting: false,
    audience: 'staff',
    emph:      { role:'bold', action:'none', student:'none', frequency:'none', outcome:'italic', setting:'none' },
    emphColor: { role:'',     action:'',     student:'',     frequency:'',     outcome:'',       setting:'' },
    fields,
    doc: { groupBy:'domain', cover:true, approvalBlock:false, guidance:true, ids:false,
           paper:'A4', font:11, org:'', logo:'', logoWidth:120, header:'', footer:'',
           colour:'#1f5872', bands:true, curriculumUrl:'' },
  };
}
let S = defaultSettings();

function blankStudent() {
  return { details: { name:'', pref:'', year:'', date: new Date().toISOString().slice(0,10),
                      by:'', review:'', context:'' },
           acts: {},      // activity index -> {level, state, picks}
           team: {} };    // support id -> pick   (chosen from the same navigator)
}
let ST = blankStudent();
let view = 'setup';
let curAct = null;        // number = activity index; 'team:<roleKey>' = a team section

/* ---------- persistence ---------- */
/* Storage can be unavailable: a private window, a full quota, or a managed
   browser with site data switched off. Never tell someone their work is saved
   when it is not — say so and point them at Save file. */
let storageBroken = false;
function saveSettings() { flash(writeStore(K_SET, S)); }
function saveStudent()  { flash(writeStore(K_STU, ST)); }
function writeStore(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { storageBroken = true; return false; }
}
let flashT = null;
function flash(ok) {
  const h = $('#savedhint'); if (!h) return;
  clearTimeout(flashT);
  if (ok === false || storageBroken) {
    h.textContent = 'Not saved — this browser is not storing data. Use Save file.';
    h.classList.add('warnhint');
    h.title = 'Your work is only in this tab. Use Save file to keep it, and Open file to come back to it.';
    return;
  }
  h.classList.remove('warnhint');
  h.textContent = 'Saved'; h.title = '';
  flashT = setTimeout(() => h.textContent = 'Saved on this device', 1400);
}
function loadAll() {
  try { const r = localStorage.getItem(K_SET); if (r) S = Object.assign(defaultSettings(), JSON.parse(r)); } catch (e) {}
  const d = defaultSettings();
  ['fields', 'emph', 'emphColor', 'doc', 'words'].forEach(k => S[k] = Object.assign(d[k], S[k] || {}));
  if (!Array.isArray(S.tierList) || !S.tierList.length) S.tierList = defaultTiers();
  if (!Array.isArray(S.customRoles)) S.customRoles = [];
  try { const r = localStorage.getItem(K_STU); if (r) ST = Object.assign(blankStudent(), JSON.parse(r)); } catch (e) {}
  /* Older saves selected a library item without retaining the activity's
     prediction.  Migrate only that missing context; never rewrite teacher text. */
  Object.values(ST.acts || {}).forEach(a => {
    if (!a || !a.picks) return;
    Object.values(a.picks).forEach(p => {
      if (p && !Number.isInteger(p.level) && Number.isInteger(a.level)) p.level = a.level;
      if (p && !p.status) p.status = 'Proposed';
    });
  });
  Object.values(ST.team || {}).forEach(p => { if (p && !p.status) p.status = 'Proposed'; });
}

/* ---------- roles ---------- */
function allRoles() { return ROLE_CAT.concat(S.customRoles || []); }
function roleDef(key) { return allRoles().find(r => r.key === key) || { key, label: key, hint: '' }; }
const roleLabel = key => S.roleLabels[key] || roleDef(key).label || key;
const roleOn = key => !S.rolesOff.includes(key);
const rolesInUse = () => allRoles().filter(r => roleOn(r.key));

/* ---------- words, levels, tiers ---------- */
const W = k => S.words[k] || k;
const AN = w => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;
const levelLabel = i => LEVELS[i];
const tierNum = t => /Tier 1/.test(t) ? 1 : /Tier 3/.test(t) ? 3 : 2;
/* the school's own name for the tier a library record maps to */
function tierFull(n) {
  const row = (S.tierList || []).find(t => t.maps === n);
  return row ? row.label : (TIERS[n - 1] || {}).label || ('Tier ' + n);
}
const tierShort = s => String(s).split(/\s[\u2013\u2014-]\s/)[0];
function tierLabel(t) {
  if (/coordination dependent/i.test(t)) return tierShort(tierFull(2)) + ' or ' + tierShort(tierFull(3));
  return tierFull(tierNum(t));
}
function prefName(sample) {
  if (sample) return 'David';
  return (ST.details.pref || ST.details.name || 'the ' + W('student')).trim();
}
/* Neutral pronoun defaults for bank placeholders (DI-297). The bank carries
   {heshethey} / {himherthem} / {hishertheir} alongside {preferredName}, but
   the builder holds no pronoun preference, so render the neutral forms
   everywhere a name placeholder is already resolved. Personalised pronouns
   belong to DI-133; until then neutral is always safe and never leaks a
   raw {token} into handed-out text. */
function resolvePronouns(v) {
  return String(v || '').replace(/\{heshethey\}/g, 'they')
    .replace(/\{himherthem\}/g, 'them').replace(/\{hishertheir\}/g, 'their');
}

/* ---------- Curriculum ---------- */
function vcLevelLabel(code) {
  const r = (VC_LEVELS || []).find(l => l.code === code);
  return r ? r.label : code;
}
function vcAreaLabel(code) {
  const r = (VC_AREAS || []).find(a => a.code === code || a.label === code);
  return r ? r.label : code;
}
function vcLinkFor(pick) {
  if (!pick) return '';
  const parts = [];
  if (pick.vcArea) parts.push(vcAreaLabel(pick.vcArea));
  if (pick.vcLevel) parts.push(vcLevelLabel(pick.vcLevel));

    { frequency: 'every time an unfamiliar task is introduced or at identified times across the week', intensity: 'targeted personalised support with one or two individual checks or prompts' },

  b.append(mk('New ' + W('student'), 'danger small', newStudent));
}
