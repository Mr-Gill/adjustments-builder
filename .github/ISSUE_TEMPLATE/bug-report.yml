name: Something in the app is not working
description: A button, export or screen does not do what it should.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please **do not attach saved student files or include any student's details**, as issues are public.
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown at the top right of the app, for example v2026.09.13 (305399c).
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome on a school laptop, Safari on iPad...
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
